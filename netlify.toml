[build]
  functions = "netlify/functions"
  publish = "."

# Security + caching headers (added in QA pass)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), payment=()"

# Images, logos and other files in /assets change rarely: let browsers keep them for 30 days.
# (To publish a changed image sooner, give the new file a new name.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
